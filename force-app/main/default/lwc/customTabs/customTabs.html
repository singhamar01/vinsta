<template>
  <lightning-card title="Custom Tabs with Drag and Drop">
    <!-- Tab Navigation -->
    <div class="slds-tabs_default">
      <ul class="slds-tabs_default__nav" role="tablist">
        <template for:each={tabs} for:item="tab">
          <li key={tab.tabId} class={tab.tabClass}  role="presentation" onclick={handleTabClick} data-tab-id={tab.tabId}>
            <a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" aria-selected={tab.active}>
              {tab.label}
              <!-- <button class="slds-button slds-button_icon" onclick={handleAddTab}>
                <lightning-icon icon-name="utility:add" size="small"></lightning-icon>
              </button>-->
            </a>
          </li>
        </template>
        <!-- Add Tab Button -->
        <li class="slds-tabs_default__item" role="presentation">
          <button class="slds-button slds-button_icon" onclick={handleAddTab} title="Add New Tab">
            <lightning-icon icon-name="utility:add" size="small"></lightning-icon>
            <span class="slds-assistive-text">Add New Tab</span>
          </button>
        </li>        
      </ul>

      <!-- Tab Content with Drop Zone -->
      <template for:each={tabs} for:item="tab">
        <div key={tab.tabId} class={tab.contentClass} ondragover={handleDragOver} ondrop={handleDrop} data-tab-id={tab.tabId}>
          <template if:true={tab.components}>
            <template for:each={tab.components} for:item="component">
              <div key={component.id} class="slds-p-around_small">
                <c-draggable-component
                      component-type={component.type}
                      record-id={recordId}
                      object-api-name={objectApiName}
                      is-disabled={component.isDisabled}
                    >
                  </c-draggable-component>
                  <template if:true={component.isCheckbox}>
                    <button onclick={toggleCheckboxMode} data-component-id={component.id}>
                      Toggle Mode
                    </button>
                  </template>
              </div>
            </template>
          </template>
          <template if:false={tab.components}>
            <div class="slds-text-body_regular">
              Drag and drop components here
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Draggable Component Palette -->
    <div class="slds-m-top_medium">
      <h3>Available Components</h3>
      <div class="slds-grid">
        <div draggable="true" ondragstart={handleDragStart} data-component-type="textInput" class="slds-col slds-p-around_small">
          <lightning-badge label="Text Input"></lightning-badge>
        </div>
        <div draggable="true" ondragstart={handleDragStart} data-component-type="dropdown" class="slds-col slds-p-around_small">
          <lightning-badge label="Dropdown"></lightning-badge>
        </div>
        <div draggable="true" ondragstart={handleDragStart} data-component-type="button" class="slds-col slds-p-around_small">
          <lightning-badge label="Button"></lightning-badge>
        </div>
        <div draggable="true" ondragstart={handleDragStart} data-component-type="caseDetails" class="slds-col slds-p-around_small">
          <lightning-badge label="Case Details"></lightning-badge>
        </div>
        <div draggable="true" ondragstart={handleDragStart} data-component-type="checkbox" class="slds-col slds-p-around_small">
          <lightning-badge label="Checkbox"></lightning-badge>
        </div>        
      </div>
    </div>
  </lightning-card>
</template>
