<template>
    <div class="checkbox-container">
        <lightning-input type="checkbox" label="Custom Checkbox" onchange={handleCheckboxChange}></lightning-input>
    </div>
    <div>
        <c-mlj-checkbox
            label="Subscribe to Newsletter"
            label-position="beside"
            is-checked={isSubscribed}
            default-background="#e0e0e0"
            checked-background="#007bff"
            name="newsletter"
            value="subscribe"
            disabled={isDisabled}
            onchange={handleCustomCheckboxChange}
        ></c-mlj-checkbox>
    </div>
    <div> 
        <!-- Label above with custom class -->
        <c-mlj-checkbox
            label="Subscribe to Newsletter above"
            label-position="above"
            custom-class="my-custom-style"
            is-checked={isSubscribed}
            default-background="#e0e0e0"
            checked-background="#007bff"
            name="newsletter"
            value="subscribe"
            onchange={handleCustomCheckboxChange}
        ></c-mlj-checkbox>
    </div>
    <div>
        <!-- Label beside with custom class -->
        <c-mlj-checkbox
            label="Accept Terms"
            label-position="beside"
            custom-class="extra-padding"
            is-checked={isAccepted}
            name="terms"
            value="accept"
        ></c-mlj-checkbox>
    </div>
</template>
