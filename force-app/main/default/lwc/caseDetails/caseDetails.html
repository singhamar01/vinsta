<template>
    <lightning-record-view-form
        object-api-name={objectApiName}
        record-id={recordId}
    >
        <div class="slds-grid">
            <div class="slds-col slds-size_1-of-2">
                <lightning-output-field field-name="CaseNumber"></lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-2">
                <lightning-output-field field-name="Status"></lightning-output-field>
            </div>
        </div>
    </lightning-record-view-form>

    <!-- Using standard lightning-input -->
    <lightning-input type="checkbox" label="Standard Input" onchange={handleInput}></lightning-input>

    <!-- Using custom checkbox -->
    <c-test-checkbox label="Custom Input" onchange={handleInput}></c-test-checkbox>

</template>
