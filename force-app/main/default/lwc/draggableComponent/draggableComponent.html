<template>
  <div class="slds-box">
    <template if:true={isTextInput}>
      <lightning-input label="Text Input" type="text"></lightning-input>
    </template>
    <template if:true={isDropdown}>
      <lightning-combobox label="Dropdown" options={options}></lightning-combobox>
    </template>
    <template if:true={isButton}>
      <c-custom-button component-type={componentType}></c-custom-button>
    </template>
    <template if:true={isCaseDetails}>
      <c-case-details component-type={componentType} record-id={recordId} object-api-name={objectApiName}></c-case-details>
    </template>
    <template if:true={isCheckbox}>
      <c-custom-checkbox component-type={componentType} record-id={recordId} object-api-name={objectApiName} is-disabled={isDisabled}></c-custom-checkbox>
    </template>
  </div>
</template>
